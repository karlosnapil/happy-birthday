<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Eng Stevooo</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#39ff14;font-family:Consolas,monospace}
canvas{position:fixed;inset:0}
#term{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
width:min(900px,90vw);background:rgba(10,10,10,.82);border:1px solid #39ff14;
padding:24px;border-radius:12px;box-shadow:0 0 30px #0f05}
#title{color:#9aa}
#out{white-space:pre-wrap;font-size:1.4rem;min-height:280px}
.cursor{display:inline-block;width:10px;background:#39ff14;animation:b .8s infinite}
@keyframes b{50%{opacity:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="term">
<div id="title">stevo@birthday:~$ ./birthday.exe</div><br>
<div id="out"></div>

<img id="photo" src="stevo.jpg"
style="display:none;width:250px;border-radius:20px;
margin:25px auto;box-shadow:0 0 25px #39ff14;">

<span class="cursor"></span>
</div>
<script>
const cvs=document.getElementById("c"),ctx=cvs.getContext("2d");
function rs(){cvs.width=innerWidth;cvs.height=innerHeight}rs();onresize=rs;
const letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fs=16,cols=Math.floor(innerWidth/fs),drops=Array(cols).fill(1);
function draw(){
ctx.fillStyle="rgba(0,0,0,.08)";ctx.fillRect(0,0,cvs.width,cvs.height);
ctx.fillStyle="#0f0";ctx.font=fs+"px monospace";
for(let i=0;i<drops.length;i++){
const t=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(t,i*fs,drops[i]*fs);
if(drops[i]*fs>cvs.height&&Math.random()>0.975)drops[i]=0;
drops[i]++;}}
setInterval(draw,35);

const msg=`Booting BirthdayOS v1.0...
Loading modules...
Checking happiness........OK
Compiling birthday.exe...
Build Successful ✔

====================================
🎉 HAPPY BIRTHDAY,
      Eng Stevooo 😍❤️❤️
====================================

Future Computer Scientist 🧑🏻‍💻💻

May your code always compile,
your bugs always disappear,
and your dreams become reality.

Have an amazing birthday! ❤️`;

let i=0,out=document.getElementById("out");
(function type(){
 if(i<msg.length){
    out.textContent+=msg[i++];
    setTimeout(type,35);
 }else{
    document.getElementById("photo").style.display="block";
 }
})();
</script>
</body>
</html>
